# Minimal Supabase CLI config for GOSHTI. Only an Edge Function is used for now
# (no database, auth or storage features).
project_id = "goshti"

[functions.generate-story]
enabled = true
# The app calls with the public anon key as a Bearer token.
verify_jwt = true

[functions.revenuecat-webhook]
enabled = true
# RevenueCat sends no Supabase login; the function checks its own secret instead.
verify_jwt = false
