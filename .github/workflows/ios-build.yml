# Builds the iPhone app in Expo's cloud and sends it to TestFlight. Run it by hand:
#   GitHub → Actions → "Build iPhone (TestFlight)" → Run workflow
#
# Works once the first iPhone build + submit has been done on a Mac (that stored the Apple
# signing certificates and the App Store Connect key with Expo). Needs the EXPO_TOKEN secret and the
# public settings in EAS (see docs/TEST_BUILD.md).
name: Build iPhone (TestFlight)

on:
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build and submit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Is the token set?
        run: |
          if [ -z "$(printf '%s' "$EXPO_TOKEN" | tr -d '[:space:]')" ]; then
            echo "::error::Add the EXPO_TOKEN secret first."; exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check before building
        run: npm run typecheck && npm test
      - name: Build and send to TestFlight
        run: |
          export EXPO_TOKEN=$(printf '%s' "$EXPO_TOKEN" | tr -d '[:space:]')
          npx eas-cli@latest build --platform ios --profile production --non-interactive --wait --auto-submit --json > "$RUNNER_TEMP/build.json" 2> "$RUNNER_TEMP/build.err" || {
            echo "::error title=Build failed::$(tail -n 15 "$RUNNER_TEMP/build.err" | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          echo "::notice title=Sent to TestFlight::Apple processes it for 10-30 minutes, then it appears in the TestFlight app."
