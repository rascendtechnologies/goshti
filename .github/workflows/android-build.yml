# Builds the Android app bundle (.aab) for Google Play, in Expo's cloud. Run it by hand:
#   GitHub → Actions → "Build Android (Play Store)" → Run workflow
#
# FIRST BUILD ONLY: Expo has to create the app's signing key, and it cannot do that without a
# person answering a question. So do the very first build once on your Mac:
#   npx eas-cli build --platform android --profile production
# (say yes to "Generate a new Android Keystore"). After that this workflow works on its own.
#
# Needs the EXPO_TOKEN secret (already set for the phone-update workflow) and the public settings
# in EAS (run `npm run eas:env` once, and again whenever a key changes).
name: Build Android (Play Store)

on:
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build .aab
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Is the token set?
        run: |
          if [ -z "$(printf '%s' "$EXPO_TOKEN" | tr -d '[:space:]')" ]; then
            echo "::error::Add the EXPO_TOKEN secret first."; exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check before building
        run: npm run typecheck && npm test
      - name: Build in Expo's cloud
        run: |
          export EXPO_TOKEN=$(printf '%s' "$EXPO_TOKEN" | tr -d '[:space:]')
          npx eas-cli@latest build --platform android --profile production --non-interactive --wait --json > "$RUNNER_TEMP/build.json" 2> "$RUNNER_TEMP/build.err" || {
            echo "::error title=Build failed::$(tail -n 15 "$RUNNER_TEMP/build.err" | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          url=$(jq -r '.[0].artifacts.buildUrl // empty' "$RUNNER_TEMP/build.json")
          echo "::notice title=Download the .aab::$url"
